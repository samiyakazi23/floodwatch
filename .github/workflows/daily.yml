name: Daily live forecast
on:
  schedule:
    - cron: "40 1 * * *"   # 07:10 IST every day
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn lightgbm requests
      - run: python scripts/live_forecast.py
      - name: Commit today's forecast
        run: |
          git config user.name "floodwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/live.json docs/data/live_log.jsonl
          git diff --cached --quiet || git commit -m "Live forecast $(date -u +%F)"
          git push
