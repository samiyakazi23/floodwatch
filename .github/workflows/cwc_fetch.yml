name: Collect CWC flood reports (one-off)
on:
  push:
    branches: [cwc-data]
    paths: [scripts/fetch_cwc_reports.py, .github/workflows/cwc_fetch.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check that a known CWC report is reachable from the runner
        run: |
          curl -sS -m 30 -A "Mozilla/5.0" -o r.pdf -w "HTTP %{http_code}, %{size_download} bytes, %{content_type}\n" \
            https://cwc.gov.in/sites/default/files/dfsitrepca-08.09.2024.pdf || true
          head -c 4 r.pdf | grep -q %PDF && echo "OK: got a PDF" || { echo "BLOCKED: no PDF returned"; head -c 400 r.pdf; exit 1; }
  fetch:
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: python3 scripts/fetch_cwc_reports.py ${{ matrix.year }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cwc
          git commit -m "CWC daily flood reports ${{ matrix.year }} (text)" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done
